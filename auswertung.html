<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Auswertung Echt oder Fake</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css?v=12">
<style>
  .wrap { max-width: 880px; }
  .login { display: flex; gap: 10px; flex-wrap: wrap; }
  .login input {
    flex: 1 1 220px; font: 16px var(--body); padding: 12px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .login .btn { width: auto; flex: 0 0 auto; }
  .werkzeuge { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 0.9rem; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi b { display: block; font: 800 1.9rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 0.85rem; color: var(--muted); }
  section.block { display: flex; flex-direction: column; gap: 12px; }
  section.block > p { max-width: 65ch; }
  .notice { border: 1.5px dashed var(--fake); border-radius: 10px; padding: 10px 14px; font-size: 0.9rem; }
  .abbildungen { display: grid; gap: 22px; }
  .folie { margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .folie svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 8px; }
  .folie figcaption { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 0.88rem; color: var(--muted); }
  .saetze { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 0.95rem; }
  details summary { cursor: pointer; }
  .inhaltsverzeichnis { display: flex; flex-direction: column; gap: 8px; }
  .inhaltsverzeichnis ol { margin: 0; padding-left: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 20px; }
  .inhaltsverzeichnis a { color: var(--accent); }
  .kapitel { padding-top: 18px; border-top: 1px solid var(--line); scroll-margin-top: 16px; }
  .kapitel h2 { display: flex; align-items: center; gap: 12px; }
  .kapnr { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 1rem; flex: none; }
  details[open] summary { margin-bottom: 10px; }
</style>
</head>
<body>
<main class="wrap stack-lg">
  <div class="stack">
    <span class="eyebrow">Auswertung</span>
    <h1>Echt oder Fake?</h1>
    <p class="muted">Wie hängen Alter und tägliche Social-Media-Nutzung damit zusammen, wie gut Menschen Fake News erkennen? Ausgewertet in vier Altersgruppen: unter 20, 20–29, 30–59, 60+.</p>
  </div>

  <form class="login" id="login">
    <input id="key" type="password" placeholder="Auswertungs-Passwort" autocomplete="current-password">
    <button class="btn" type="submit">Daten laden</button>
    <button class="btn btn-ghost" type="button" id="demo">Simulation</button>
  </form>
  <div class="werkzeuge">
    <span class="status" id="status" aria-live="polite"></span>
    <button class="link" id="csv" hidden>Rohdaten als CSV herunterladen</button>
  </div>

  <div id="inhalt" class="stack-lg"></div>
</main>

<script src="config.js?v=12"></script>
<script>
(() => {
  const C = window.UMFRAGE_CONFIG;
  const S = C.szenarien;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let aktuelleRows = [];
  let timer = null;
  const ALTER_4 = ["unter 20", "20–29", "30–59", "60+"];
  const ZU_4 = { "unter 16": "unter 20", "16–19": "unter 20", "20–29": "20–29", "30–44": "30–59", "45–59": "30–59", "60+": "60+" };

  try { $("#key").value = localStorage.getItem("fn_key") || ""; } catch {}

  async function laden() {
    if (!C.endpoint) { $("#status").textContent = "In config.js ist noch kein endpoint eingetragen."; return; }
    const key = $("#key").value;
    try { localStorage.setItem("fn_key", key); } catch {}
    try {
      const r = await fetch(`${C.endpoint}?key=${encodeURIComponent(key)}`);
      const d = await r.json();
      if (!d.ok) { $("#status").textContent = d.error || "Fehler beim Laden."; clearInterval(timer); return; }
      $("#status").textContent = `Live · aktualisiert ${new Date().toLocaleTimeString("de-DE")} · lädt jede Minute neu`;
      // Testzeilen (Alter „TEST“) nicht mitzählen
      render(d.rows.filter((r) => r.alter !== "TEST"), false);
    } catch (err) {
      $("#status").textContent = "Laden fehlgeschlagen. Internetverbindung oder endpoint-URL prüfen.";
    }
  }

  $("#login").addEventListener("submit", (e) => {
    e.preventDefault();
    $("#status").textContent = "Lade …";
    clearInterval(timer);
    laden();
    timer = setInterval(laden, 60000);
  });
  $("#demo").addEventListener("click", () => {
    clearInterval(timer);
    $("#status").textContent = "";
    render(beispiel(), true);
  });

  $("#csv").addEventListener("click", () => {
    if (!aktuelleRows.length) return;
    const spalten = [...new Set(aktuelleRows.flatMap((r) => Object.keys(r)))];
    const zelle = (v) => { const s = String(v ?? ""); return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const csv = [spalten.join(";"), ...aktuelleRows.map((r) => spalten.map((k) => zelle(r[k])).join(";"))].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = `echt-oder-fake_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  });

  // ---------- Simulation: erfundene Daten, um die Auswertung vorzuführen ----------
  // Wird überall als „SIMULIERTE DATEN“ gekennzeichnet und nie mit echten Antworten vermischt.
  function beispiel() {
    const rows = [];
    const schw = { quelle: 0.88, inhalt: 0.66, taeuscht: 0.4 };
    const proAlter = { "unter 16": 20, "16–19": 40, "20–29": 24, "30–44": 19, "45–59": 22, "60+": 8 };
    // Jüngere nutzen im Schnitt mehr Social Media
    const smGewicht = { "unter 16": [1, 2, 4, 4, 3], "16–19": [1, 2, 4, 5, 4], "20–29": [2, 3, 4, 3, 2], "30–44": [3, 4, 3, 2, 1], "45–59": [4, 4, 2, 1, 1], "60+": [5, 3, 2, 1, 0] };
    const ziehe = (gew) => { let x = Math.random() * gew.reduce((t, v) => t + v, 0); for (let i = 0; i < gew.length; i++) { x -= gew[i]; if (x < 0) return i; } return gew.length - 1; };
    Object.entries(proAlter).forEach(([alter, anzahl]) => {
      const a = C.alter.indexOf(alter);
      for (let n = 0; n < anzahl; n++) {
        const s = ziehe(smGewicht[alter]);
        const row = { alter, screentime: C.screentime[s] };
        let r = 0, f = 0, k = 0;
        S.forEach((sz) => {
          const p = Math.max(0.15, Math.min(0.97, schw[sz.typ] - 0.03 * s + (a === 5 ? -0.08 : 0) + (Math.random() - 0.5) * 0.15));
          const x = Math.random();
          const erg = x < 0.07 ? "keine_ahnung" : x < 0.07 + p * 0.93 ? "richtig" : "falsch";
          row[`${sz.id}_ergebnis`] = erg;
          row[`${sz.id}_sicher`] = erg === "keine_ahnung" ? "" : Math.random() < 0.5 + 0.05 * s ? "sicher" : "geraten";
          erg === "richtig" ? r++ : erg === "falsch" ? f++ : k++;
        });
        Object.assign(row, { richtig: r, falsch: f, keine_ahnung: k, anzahl: S.length, quote: Math.round(r / S.length * 100) });
        rows.push(row);
      }
    });
    return rows;
  }

  // ---------- Berechnung ----------
  const mittel = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);
  const pct = (v) => (v == null ? "–" : Math.round(v) + " %");
  const quote = (r) => (Number(r.richtig) / Number(r.anzahl || S.length)) * 100;
  const kaQuote = (r) => (Number(r.keine_ahnung || 0) / Number(r.anzahl || S.length)) * 100;

  // Einzelantworten flach: eine Zeile pro Person × Szenario
  function antworten(rows) {
    return rows.flatMap((r) => S.map((s) => ({
      row: r, szenario: s, ergebnis: r[`${s.id}_ergebnis`], sicher: r[`${s.id}_sicher`]
    })).filter((x) => x.ergebnis));
  }

  // ---------- Statistik: Spearman-Rangkorrelation mit p-Wert ----------
  function raenge(werte) {
    const idx = werte.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
    const r = new Array(werte.length);
    for (let i = 0; i < idx.length; ) {
      let j = i;
      while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
      const durchschnitt = (i + j) / 2 + 1; // gleiche Werte bekommen den mittleren Rang
      for (let k = i; k <= j; k++) r[idx[k][1]] = durchschnitt;
      i = j + 1;
    }
    return r;
  }
  function pearson(x, y) {
    const n = x.length;
    if (n < 3) return null;
    const mx = x.reduce((s, v) => s + v, 0) / n, my = y.reduce((s, v) => s + v, 0) / n;
    let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < n; i++) { const dx = x[i] - mx, dy = y[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
    return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
  }
  const spearman = (x, y) => pearson(raenge(x), raenge(y));
  function gammaln(x) {
    const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
    let y = x, tmp = x + 5.5;
    tmp -= (x + 0.5) * Math.log(tmp);
    let ser = 1.000000000190015;
    for (const ci of c) ser += ci / ++y;
    return -tmp + Math.log(2.5066282746310005 * ser / x);
  }
  function betacf(a, b, x) {
    const FPMIN = 1e-300;
    const qab = a + b, qap = a + 1, qam = a - 1;
    let c = 1, d = 1 - qab * x / qap;
    if (Math.abs(d) < FPMIN) d = FPMIN;
    d = 1 / d;
    let h = d;
    for (let m = 1; m <= 300; m++) {
      const m2 = 2 * m;
      let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d;
      const del = d * c; h *= del;
      if (Math.abs(del - 1) < 3e-12) break;
    }
    return h;
  }
  function betai(a, b, x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    const bt = Math.exp(gammaln(a + b) - gammaln(a) - gammaln(b) + a * Math.log(x) + b * Math.log(1 - x));
    return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
  }
  // zweiseitiger p-Wert über die t-Verteilung, df = Freiheitsgrade
  function pWert(r, df) {
    if (r == null || df < 1) return null;
    if (Math.abs(r) >= 1) return 0;
    const t2 = r * r * df / (1 - r * r);
    return betai(df / 2, 0.5, df / (df + t2));
  }
  // Partielle Korrelation: Zusammenhang x–y, wenn z (Drittvariable) herausgerechnet wird
  function partiell(rxy, rxz, ryz) {
    const nenner = Math.sqrt((1 - rxz * rxz) * (1 - ryz * ryz));
    return rxy == null || rxz == null || ryz == null || !nenner ? null : (rxy - rxz * ryz) / nenner;
  }

  // ---------- Abbildungen im Folienformat (16:9, feste helle Farben für Beamer und PNG) ----------
  const W = 1600, H = 900;
  const F = { ink: "#17202c", muted: "#5d6877", grid: "#e2e6ec", akzent: "#23408e", box: "#d9e1f5", ok: "#1b7a50", no: "#c0391f", na: "#b9c0ca", weiss: "#ffffff" };
  const FONT = "Helvetica Neue, Helvetica, Arial, sans-serif";
  const zahl = (x, d = 2) => (x == null ? "–" : x.toFixed(d).replace(".", ",").replace("-", "−"));
  const pText = (p) => (p == null ? "–" : p < 0.001 ? "p < 0,001" : `p = ${zahl(p, 3)}`);

  function einordnen(r, p) {
    if (r == null) return "zu wenige Daten für eine Korrelation";
    const b = Math.abs(r);
    const staerke = b < 0.1 ? "kein nennenswerter" : b < 0.3 ? "ein schwacher" : b < 0.5 ? "ein mittlerer" : "ein starker";
    const richtung = b < 0.1 ? "" : r > 0 ? " positiver" : " negativer";
    const sig = p == null ? "" : p < 0.05 ? ", statistisch signifikant" : ", statistisch nicht signifikant";
    return `${staerke}${richtung} Zusammenhang${sig}`;
  }

  let wasserzeichen = false;
  function rahmen(id, titel, untertitel, fuss, inhalt) {
    const wz = wasserzeichen ? `<text x="${W / 2}" y="${H / 2 + 40}" font-size="120" font-weight="700" fill="#c0391f" fill-opacity="0.10" text-anchor="middle" transform="rotate(-18 ${W / 2} ${H / 2})">SIMULATION</text>` : "";
    return `<svg id="${id}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${FONT}" role="img" aria-label="${esc(titel)}">
      <rect width="${W}" height="${H}" fill="${F.weiss}"/>
      <text x="80" y="88" font-size="46" font-weight="700" fill="${F.ink}">${esc(titel)}</text>
      <text x="80" y="138" font-size="27" fill="${F.muted}">${esc(untertitel)}</text>
      ${inhalt}
      ${wz}
      <text x="80" y="${H - 32}" font-size="19" fill="${F.muted}">${esc(fuss)}</text>
    </svg>`;
  }

  function quantil(sortiert, q) {
    const pos = (sortiert.length - 1) * q, u = Math.floor(pos), o = Math.ceil(pos);
    return sortiert[u] + (sortiert[o] - sortiert[u]) * (pos - u);
  }

  // Boxplot: gruppen = [{label, werte:[...]}], y von 0 bis yMax
  function boxplot(id, titel, untertitel, fuss, gruppen, yMax, yTitel) {
    const L = 150, R = 60, T = 190, B = 160, pw = W - L - R, ph = H - T - B;
    const y = (v) => T + ph - (v / yMax) * ph;
    const band = pw / gruppen.length, bw = Math.min(150, band * 0.5);
    let s = "";
    for (let v = 0; v <= yMax; v += 3) {
      s += `<line x1="${L}" x2="${L + pw}" y1="${y(v)}" y2="${y(v)}" stroke="${F.grid}" stroke-width="2"/>
            <text x="${L - 18}" y="${y(v) + 9}" font-size="24" fill="${F.muted}" text-anchor="end">${v}</text>`;
    }
    s += `<text transform="translate(52 ${T + ph / 2}) rotate(-90)" font-size="24" fill="${F.muted}" text-anchor="middle">${esc(yTitel)}</text>`;
    gruppen.forEach((g, i) => {
      const cx = L + band * i + band / 2;
      const w = [...g.werte].sort((a, b) => a - b), n = w.length;
      s += `<text x="${cx}" y="${T + ph + 46}" font-size="25" font-weight="700" fill="${F.ink}" text-anchor="middle">${esc(g.label)}</text>
            <text x="${cx}" y="${T + ph + 80}" font-size="21" fill="${F.muted}" text-anchor="middle">n = ${n}</text>`;
      if (!n) { s += `<text x="${cx}" y="${y(yMax / 2)}" font-size="21" fill="${F.muted}" text-anchor="middle">keine Daten</text>`; return; }
      if (n < 5) {
        // zu wenige Werte für einen sinnvollen Boxplot: Einzelwerte zeigen
        w.forEach((v, k) => { s += `<circle cx="${cx + (k - (n - 1) / 2) * 22}" cy="${y(v)}" r="9" fill="${F.akzent}" fill-opacity="0.75"><title>${esc(g.label)}: ${v} Punkte</title></circle>`; });
        s += `<text x="${cx}" y="${T - 14}" font-size="19" fill="${F.muted}" text-anchor="middle">Einzelwerte (n &lt; 5)</text>`;
        return;
      }
      const q1 = quantil(w, 0.25), med = quantil(w, 0.5), q3 = quantil(w, 0.75), iqr = q3 - q1;
      const lo = w.find((v) => v >= q1 - 1.5 * iqr), hi = [...w].reverse().find((v) => v <= q3 + 1.5 * iqr);
      const tip = `${g.label}: Median ${zahl(med, 1)}, mittlere 50 % von ${zahl(q1, 1)} bis ${zahl(q3, 1)}, n = ${n}`;
      s += `<line x1="${cx}" x2="${cx}" y1="${y(hi)}" y2="${y(q3)}" stroke="${F.akzent}" stroke-width="3"/>
            <line x1="${cx}" x2="${cx}" y1="${y(q1)}" y2="${y(lo)}" stroke="${F.akzent}" stroke-width="3"/>
            <line x1="${cx - bw / 4}" x2="${cx + bw / 4}" y1="${y(hi)}" y2="${y(hi)}" stroke="${F.akzent}" stroke-width="3"/>
            <line x1="${cx - bw / 4}" x2="${cx + bw / 4}" y1="${y(lo)}" y2="${y(lo)}" stroke="${F.akzent}" stroke-width="3"/>
            <rect x="${cx - bw / 2}" y="${y(q3)}" width="${bw}" height="${Math.max(3, y(q1) - y(q3))}" rx="4" fill="${F.box}" stroke="${F.akzent}" stroke-width="3"><title>${esc(tip)}</title></rect>
            <line x1="${cx - bw / 2}" x2="${cx + bw / 2}" y1="${y(med)}" y2="${y(med)}" stroke="${F.ink}" stroke-width="5"/>`;
      w.filter((v) => v < lo || v > hi).forEach((v) => {
        s += `<circle cx="${cx}" cy="${y(v)}" r="8" fill="${F.weiss}" stroke="${F.akzent}" stroke-width="3"><title>Ausreißer: ${v} Punkte</title></circle>`;
      });
    });
    return rahmen(id, titel, untertitel, fuss, s);
  }

  // Streudiagramm: Stufe (x, leicht gestreut) gegen Punkte (y)
  function streu(id, titel, untertitel, fuss, punkte, stufen, yMax, yTitel) {
    const L = 150, R = 60, T = 190, B = 160, pw = W - L - R, ph = H - T - B;
    const band = pw / stufen.length;
    const x = (i) => L + band * i + band / 2, y = (v) => T + ph - (v / yMax) * ph;
    let s = "";
    for (let v = 0; v <= yMax; v += 3) {
      s += `<line x1="${L}" x2="${L + pw}" y1="${y(v)}" y2="${y(v)}" stroke="${F.grid}" stroke-width="2"/>
            <text x="${L - 18}" y="${y(v) + 9}" font-size="24" fill="${F.muted}" text-anchor="end">${v}</text>`;
    }
    s += `<text transform="translate(52 ${T + ph / 2}) rotate(-90)" font-size="24" fill="${F.muted}" text-anchor="middle">${esc(yTitel)}</text>`;
    stufen.forEach((st, i) => { s += `<text x="${x(i)}" y="${T + ph + 46}" font-size="25" font-weight="700" fill="${F.ink}" text-anchor="middle">${esc(st)}</text>`; });
    // feste Streuung pro Punkt (aus dem Index berechnet), damit das Bild bei jedem Laden gleich aussieht
    punkte.forEach((p, k) => {
      const jx = (((k * 37) % 23) / 22 - 0.5) * band * 0.5, jy = (((k * 53) % 17) / 16 - 0.5) * 0.5;
      s += `<circle cx="${x(p.x) + jx}" cy="${y(Math.min(yMax, Math.max(0, p.y + jy)))}" r="8" fill="${F.akzent}" fill-opacity="0.45"><title>${esc(stufen[p.x])}: ${p.y} Punkte</title></circle>`;
    });
    stufen.forEach((st, i) => {
      const w = punkte.filter((p) => p.x === i).map((p) => p.y).sort((a, b) => a - b);
      if (!w.length) return;
      const med = quantil(w, 0.5);
      s += `<line x1="${x(i) - band * 0.3}" x2="${x(i) + band * 0.3}" y1="${y(med)}" y2="${y(med)}" stroke="${F.ink}" stroke-width="5"><title>Median ${zahl(med, 1)}</title></line>`;
    });
    s += `<line x1="${L + pw - 330}" x2="${L + pw - 290}" y1="${T - 26}" y2="${T - 26}" stroke="${F.ink}" stroke-width="5"/>
          <text x="${L + pw - 280}" y="${T - 18}" font-size="21" fill="${F.muted}">Median je Stufe</text>`;
    return rahmen(id, titel, untertitel, fuss, s);
  }

  // Horizontale Balken: daten = [{label, wert, text}], max = Skalenende
  function hbalken(id, titel, untertitel, fuss, daten, max) {
    const L = 430, R = 160, T = 200, B = 110, pw = W - L - R, ph = H - T - B;
    const zeile = ph / daten.length, bh = Math.min(64, zeile * 0.62);
    let s = "";
    daten.forEach((d, i) => {
      const cy = T + zeile * i + zeile / 2, w = max ? (d.wert / max) * pw : 0;
      s += `<text x="${L - 24}" y="${cy + 9}" font-size="26" fill="${F.ink}" text-anchor="end">${esc(d.label)}</text>
            <rect x="${L}" y="${cy - bh / 2}" width="${pw}" height="${bh}" fill="${F.grid}" rx="4"/>
            <rect x="${L}" y="${cy - bh / 2}" width="${Math.max(0, w)}" height="${bh}" fill="${F.akzent}" rx="4"><title>${esc(d.label)}: ${esc(d.text)}</title></rect>
            <text x="${L + pw + 20}" y="${cy + 10}" font-size="28" font-weight="700" fill="${F.ink}">${esc(d.text)}</text>`;
    });
    return rahmen(id, titel, untertitel, fuss, s);
  }

  // Gestapelte Balken richtig / falsch / keine Ahnung
  function stapel(id, titel, untertitel, fuss, daten) {
    const L = 470, R = 60, T = 250, B = 130, pw = W - L - R, ph = H - T - B;
    const zeile = ph / daten.length, bh = Math.min(90, zeile * 0.55);
    let s = "";
    [["richtig", F.ok], ["falsch", F.no], ["keine Ahnung", F.na]].forEach(([t, c], i) => {
      s += `<rect x="${L + i * 230}" y="${T - 72}" width="22" height="22" rx="4" fill="${c}"/>
            <text x="${L + i * 230 + 32}" y="${T - 53}" font-size="23" fill="${F.ink}">${t}</text>`;
    });
    daten.forEach((d, i) => {
      const cy = T + zeile * i + zeile / 2;
      s += `<text x="${L - 24}" y="${cy - 4}" font-size="27" font-weight="700" fill="${F.ink}" text-anchor="end">${esc(d.label)}</text>
            <text x="${L - 24}" y="${cy + 28}" font-size="21" fill="${F.muted}" text-anchor="end">${esc(d.hinweis)}</text>`;
      let x0 = L;
      [[d.ok, F.ok, "richtig"], [d.no, F.no, "falsch"], [d.na, F.na, "keine Ahnung"]].forEach(([v, c, t]) => {
        const w = (v / 100) * pw;
        if (w <= 0) return;
        s += `<rect x="${x0}" y="${cy - bh / 2}" width="${Math.max(0, w - 2)}" height="${bh}" fill="${c}"><title>${t}: ${Math.round(v)} %</title></rect>`;
        if (w > 70) s += `<text x="${x0 + 16}" y="${cy + 10}" font-size="27" font-weight="700" fill="${c === F.na ? F.ink : F.weiss}">${Math.round(v)} %</text>`;
        x0 += w;
      });
    });
    return rahmen(id, titel, untertitel, fuss, s);
  }

  // Kennzahlen-Tabelle als Bild
  function kennzahlenBild(id, titel, untertitel, fuss, zeilen) {
    const L = 80, T = 230, zh = 112;
    const sp = [L, 980, 1200, 1430];
    let s = ["Zusammenhang", "ρ (Spearman)", "p-Wert", "n"].map((t, i) =>
      `<text x="${sp[i]}" y="${T - 26}" font-size="22" font-weight="700" fill="${F.muted}">${t}</text>`).join("");
    zeilen.forEach((z, i) => {
      const yy = T + i * zh;
      s += `<line x1="${L}" x2="${W - 80}" y1="${yy}" y2="${yy}" stroke="${F.grid}" stroke-width="2"/>
            <text x="${sp[0]}" y="${yy + 50}" font-size="27" font-weight="700" fill="${F.ink}">${esc(z.label)}</text>
            <text x="${sp[0]}" y="${yy + 86}" font-size="21" fill="${F.muted}">${esc(z.deutung)}</text>
            <text x="${sp[1]}" y="${yy + 62}" font-size="34" font-weight="700" fill="${F.ink}">${zahl(z.r)}</text>
            <text x="${sp[2]}" y="${yy + 62}" font-size="28" fill="${F.ink}">${esc(pText(z.p))}</text>
            <text x="${sp[3]}" y="${yy + 62}" font-size="28" fill="${F.ink}">${z.n}</text>`;
    });
    return rahmen(id, titel, untertitel, fuss, s);
  }

  // Heatmap: Zeilen × Spalten, Farbe = Wert (eine Farbe: hell = niedrig, dunkel = hoch)
  function mische(t) {
    const a = [234, 239, 249], b = [29, 58, 133];
    return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",")})`;
  }
  function heatmap(id, titel, untertitel, fuss, zeilen, spalten, wert, o = {}) {
    const min = o.min ?? 30, max = o.max ?? 100, format = o.format || ((v) => `${Math.round(v)} %`), mitN = o.mitN !== false;
    const legende = o.legende || ["30 % oder weniger", "100 %"];
    const L = o.labelBreite || 300, R = 60, T = 235, B = 150;
    const cw = (W - L - R) / spalten.length, ch = Math.min(120, (H - T - B) / zeilen.length);
    const lab = (x) => x.label ?? x, key = (x) => x.key ?? x;
    let s = "";
    if (o.spaltenTitel) s += `<text x="${L + (W - L - R) / 2}" y="${T - 62}" font-size="21" fill="${F.muted}" text-anchor="middle">${esc(o.spaltenTitel)}</text>`;
    spalten.forEach((sp, j) => { s += `<text x="${L + cw * j + cw / 2}" y="${T - 20}" font-size="24" font-weight="700" fill="${F.ink}" text-anchor="middle">${esc(lab(sp))}</text>`; });
    zeilen.forEach((z, i) => {
      const cy = T + ch * i;
      s += `<text x="${L - 20}" y="${cy + ch / 2 + 9}" font-size="25" font-weight="700" fill="${F.ink}" text-anchor="end">${esc(lab(z))}</text>`;
      spalten.forEach((sp, j) => {
        const { v, n } = wert(key(z), key(sp));
        const x = L + cw * j;
        if (!n || v == null) {
          s += `<rect x="${x + 3}" y="${cy + 3}" width="${cw - 6}" height="${ch - 6}" rx="6" fill="${F.weiss}" stroke="${F.grid}" stroke-width="2"/>
                <text x="${x + cw / 2}" y="${cy + ch / 2 + 9}" font-size="26" fill="${F.muted}" text-anchor="middle">–</text>`;
          return;
        }
        const t = Math.max(0, Math.min(1, (v - min) / (max - min)));
        const klein = mitN && n < 3;
        const fill = klein ? "#f1f3f6" : mische(t);
        const tf = klein ? F.muted : t > 0.55 ? F.weiss : F.ink;
        s += `<rect x="${x + 3}" y="${cy + 3}" width="${cw - 6}" height="${ch - 6}" rx="6" fill="${fill}"><title>${esc(`${lab(z)} · ${lab(sp)}: ${format(v)}${mitN ? `, n = ${n}` : ""}`)}</title></rect>
              <text x="${x + cw / 2}" y="${cy + ch / 2 + (mitN ? 3 : 11)}" font-size="30" font-weight="700" fill="${tf}" text-anchor="middle">${esc(format(v))}</text>`;
        if (mitN) s += `<text x="${x + cw / 2}" y="${cy + ch / 2 + 31}" font-size="19" fill="${tf}" text-anchor="middle">n = ${n}</text>`;
      });
    });
    // Legende in 5 Stufen
    const ly = H - B + 42, lx = W - R - 520;
    s += `<text x="${lx - 14}" y="${ly + 17}" font-size="19" fill="${F.muted}" text-anchor="end">${esc(legende[0])}</text>`;
    [0, 0.25, 0.5, 0.75, 1].forEach((t, k) => { s += `<rect x="${lx + k * 50}" y="${ly}" width="46" height="22" rx="3" fill="${mische(t)}"/>`; });
    s += `<text x="${lx + 262}" y="${ly + 17}" font-size="19" fill="${F.muted}">${esc(legende[1])}</text>`;
    if (mitN) s += `<text x="80" y="${ly + 17}" font-size="19" fill="${F.muted}">Grau: weniger als 3 Personen, kaum aussagekräftig</text>`;
    return rahmen(id, titel, untertitel, fuss, s);
  }

  // Alle 15 Paare als gestapelte Balken
  function paareBild(id, titel, untertitel, fuss, daten) {
    const L = 600, R = 60, T = 225, B = 80, pw = W - L - R, zeile = (H - T - B) / daten.length, bh = zeile * 0.72;
    let s = "";
    [["richtig", F.ok], ["falsch", F.no], ["keine Ahnung", F.na]].forEach(([t, c], i) => {
      s += `<rect x="${L + i * 230}" y="${T - 52}" width="22" height="22" rx="4" fill="${c}"/>
            <text x="${L + i * 230 + 32}" y="${T - 33}" font-size="22" fill="${F.ink}">${t}</text>`;
    });
    daten.forEach((d, i) => {
      const cy = T + zeile * i + zeile / 2;
      s += `<text x="${L - 20}" y="${cy + 7}" font-size="20" fill="${F.ink}" text-anchor="end">${esc(d.label)}</text>`;
      let x0 = L;
      [[d.ok, F.ok, "richtig"], [d.no, F.no, "falsch"], [d.na, F.na, "keine Ahnung"]].forEach(([v, c, t]) => {
        const w = (v / 100) * pw;
        if (w <= 0) return;
        s += `<rect x="${x0}" y="${cy - bh / 2}" width="${Math.max(0, w - 2)}" height="${bh}" fill="${c}"><title>${esc(d.label)} · ${t}: ${Math.round(v)} %</title></rect>`;
        if (w > 64) s += `<text x="${x0 + 10}" y="${cy + 7}" font-size="19" font-weight="700" fill="${c === F.na ? F.ink : F.weiss}">${Math.round(v)} %</text>`;
        x0 += w;
      });
    });
    return rahmen(id, titel, untertitel, fuss, s);
  }

  // ---------- Darstellung ----------
  function render(rohdaten, demo) {
    aktuelleRows = demo ? [] : rohdaten; // CSV nur für echte Daten
    $("#csv").hidden = !aktuelleRows.length;
    wasserzeichen = demo;
    const inhalt = $("#inhalt");
    // Für die Auswertung immer 4 Altersgruppen
    const rows = rohdaten.map((r) => ({ ...r, alter: ZU_4[r.alter] || r.alter })).filter((r) => ALTER_4.includes(r.alter));
    if (!rows.length) { inhalt.innerHTML = `<p class="muted">Noch keine Antworten. Sobald jemand die Umfrage abschickt, erscheint sie hier.</p>`; return; }

    const stand = new Date().toLocaleDateString("de-DE");
    const daten = rows.map((r) => ({ a: ALTER_4.indexOf(r.alter), s: C.screentime.indexOf(r.screentime), p: Number(r.richtig), row: r }))
      .filter((d) => d.a >= 0 && d.s >= 0 && Number.isFinite(d.p));
    const n = daten.length;
    const fuss = `${demo ? "SIMULIERTE DATEN, KEINE ECHTEN ERGEBNISSE · " : ""}Quelle: eigene Online-Umfrage „Echt oder Fake?“, n = ${n}, Stand: ${stand}`;
    const alle = antworten(rows);
    const anteil = (liste, e) => (liste.length ? (liste.filter((x) => x.ergebnis === e).length / liste.length) * 100 : null);
    const personen = (liste) => new Set(liste.map((x) => x.row)).size;
    const sicherAntworten = alle.filter((x) => x.ergebnis !== "keine_ahnung" && x.sicher === "sicher");

    // Korrelationen
    const rSP = spearman(daten.map((d) => d.s), daten.map((d) => d.p)), pSP = pWert(rSP, n - 2);
    const rAP = spearman(daten.map((d) => d.a), daten.map((d) => d.p)), pAP = pWert(rAP, n - 2);
    const rAS = spearman(daten.map((d) => d.a), daten.map((d) => d.s)), pAS = pWert(rAS, n - 2);
    const rSPa = partiell(rSP, rAS, rAP), pSPa = pWert(rSPa, n - 3);
    const rAPs = partiell(rAP, rAS, rSP), pAPs = pWert(rAPs, n - 3);

    const yT = "richtig erkannte Paare (von 15)";
    const sm = C.screentime, al = ALTER_4;
    const zaehl = (feld, werte) => werte.map((w, i) => { const k = daten.filter((d) => d[feld] === i).length; return { label: w, wert: k, text: `${k} (${Math.round((k / n) * 100)} %)` }; });
    const typen = Object.keys(C.typen).map((k) => ({ key: k, label: C.typen[k] }));
    const merkmale = Object.keys(C.merkmale).map((k) => ({ key: k, label: `${C.merkmale[k]} (${S.filter((s) => s.merkmal === k).length})` }));
    const kiPaare = S.filter((s) => s.ki).map((s) => ({ key: s.id, label: s.ki === "fake" ? `${s.thema}: Siegel am Fake` : `${s.thema}: Siegel an echter Meldung` }));
    // Zeilen = Eigenschaft der Paare (Typ, Merkmal, Paar), Spalten = Gruppe (Alter oder Social-Media-Zeit)
    const quoteZelle = (feld, eig) => (k, w) => {
      const g = alle.filter((x) => x.row[feld] === w && x.szenario[eig] === k);
      return { v: anteil(g, "richtig"), n: personen(g) };
    };
    const sicherNach = (feld, werte) => werte.map((w) => {
      const g = sicherAntworten.filter((x) => x.row[feld] === w);
      const v = anteil(g, "richtig");
      return { label: `${w} (n = ${personen(g)})`, wert: v ?? 0, text: v == null ? "–" : `${Math.round(v)} %` };
    });
    const ka = (feld, werte) => werte.map((w) => {
      const g = alle.filter((x) => x.row[feld] === w);
      const v = anteil(g, "keine_ahnung");
      return { label: `${w} (n = ${personen(g)})`, wert: v ?? 0, text: v == null ? "–" : `${Math.round(v)} %` };
    });

    const kapitel = [
      { id: "kap-stichprobe", titel: "Stichprobe", text: "Wer hat mitgemacht? Für die Folie „Stichprobe“ und den Methodenteil.", abb: [
        { folie: "Stichprobe", name: "stichprobe_alter", svg: (id) => hbalken(id, "Teilnehmende nach Alter", `${n} Teilnehmende insgesamt`, fuss, zaehl("a", al), Math.max(1, ...zaehl("a", al).map((d) => d.wert))) },
        { folie: "Stichprobe", name: "stichprobe_social_media", svg: (id) => hbalken(id, "Teilnehmende nach täglicher Social-Media-Zeit", `${n} Teilnehmende insgesamt`, fuss, zaehl("s", sm), Math.max(1, ...zaehl("s", sm).map((d) => d.wert))) },
        { folie: "Stichprobe / Drittvariable", name: "stichprobe_alter_x_social_media", svg: (id) => {
          const z = (w, k) => { const c = daten.filter((d) => d.a === al.indexOf(w) && d.s === sm.indexOf(k)).length; return { v: c, n: c }; };
          const mx = Math.max(1, ...al.flatMap((w) => sm.map((k) => z(w, k).v)));
          return heatmap(id, "Wer nutzt wie viel Social Media?", `Anzahl Personen je Altersgruppe und Social-Media-Zeit · Spearman ρ = ${zahl(rAS)}, ${pText(pAS)}`, fuss,
            al, sm, z, { min: 0, max: mx, format: (v) => String(v), mitN: false, legende: ["0", String(mx)], labelBreite: 240, spaltenTitel: "tägliche Social-Media-Zeit" });
        } }
      ] },
      { id: "kap-social", titel: "Social-Media-Zeit und Trefferquote", text: "Die erste Hälfte der Forschungsfrage.", abb: [
        { folie: "Ergebnis Social Media", name: "boxplot_social_media", svg: (id) => boxplot(id, "Trefferquote nach täglicher Social-Media-Zeit", `Spearman ρ = ${zahl(rSP)}, ${pText(pSP)}: ${einordnen(rSP, pSP)}`, fuss,
          sm.map((st, i) => ({ label: st, werte: daten.filter((d) => d.s === i).map((d) => d.p) })), 15, yT) },
        { folie: "Ergebnis Social Media (Alternative)", name: "streudiagramm_social_media", svg: (id) => streu(id, "Streudiagramm: Social-Media-Zeit und Trefferquote", `Jeder Punkt ist eine Person · Spearman ρ = ${zahl(rSP)}, ${pText(pSP)}`, fuss,
          daten.map((d) => ({ x: d.s, y: d.p })), sm, 15, yT) }
      ] },
      { id: "kap-alter", titel: "Alter und Trefferquote", text: "Die zweite Hälfte der Forschungsfrage.", abb: [
        { folie: "Ergebnis Alter", name: "boxplot_alter", svg: (id) => boxplot(id, "Trefferquote nach Alter", `Spearman ρ = ${zahl(rAP)}, ${pText(pAP)}: ${einordnen(rAP, pAP)}`, fuss,
          al.map((a, i) => ({ label: a, werte: daten.filter((d) => d.a === i).map((d) => d.p) })), 15, yT) },
        { folie: "Ergebnis Alter (Alternative)", name: "streudiagramm_alter", svg: (id) => streu(id, "Streudiagramm: Alter und Trefferquote", `Jeder Punkt ist eine Person · Spearman ρ = ${zahl(rAP)}, ${pText(pAP)}`, fuss,
          daten.map((d) => ({ x: d.a, y: d.p })), al, 15, yT) }
      ] },
      { id: "kap-beide", titel: "Alter und Social-Media-Zeit zusammen", text: "Beide Merkmale gleichzeitig. Wichtig für die Folie „Korrelation ≠ Kausalität“: Jüngere nutzen mehr Social Media, deshalb muss man prüfen, welches Merkmal wirklich mit der Trefferquote zusammenhängt.", abb: [
        { folie: "Beide Variablen", name: "heatmap_alter_x_social_media", svg: (id) => heatmap(id, "Trefferquote nach Alter und Social-Media-Zeit", "Durchschnittlich richtig erkannte Paare in Prozent", fuss,
          al, sm, (w, k) => { const g = daten.filter((d) => d.a === al.indexOf(w) && d.s === sm.indexOf(k)); return { v: mittel(g.map((d) => (d.p / 15) * 100)), n: g.length }; },
          { labelBreite: 240, spaltenTitel: "tägliche Social-Media-Zeit" }) },
        { folie: "Korrelation ≠ Kausalität", name: "korrelationen", svg: (id) => kennzahlenBild(id, "Korrelationen im Überblick", "Rangkorrelation nach Spearman, zweiseitig getestet (signifikant bei p < 0,05)", fuss, [
          { label: "Social-Media-Zeit ↔ Trefferquote", deutung: einordnen(rSP, pSP), r: rSP, p: pSP, n },
          { label: "Alter ↔ Trefferquote", deutung: einordnen(rAP, pAP), r: rAP, p: pAP, n },
          { label: "Alter ↔ Social-Media-Zeit (Drittvariable?)", deutung: einordnen(rAS, pAS), r: rAS, p: pAS, n },
          { label: "Social-Media-Zeit ↔ Trefferquote ohne Alterseffekt", deutung: `partielle Korrelation: ${einordnen(rSPa, pSPa)}`, r: rSPa, p: pSPa, n }
        ]) }
      ] },
      { id: "kap-aufmachung", titel: "Aufmachung und Fake-Merkmale", text: "Welche Fakes werden erkannt? Aufmachung hilft: echt = seriöser Artikel, Fake = Post. Gleiche Aufmachung: beide sehen gleich aus. Aufmachung täuscht: echt = lockerer Post, Fake = seriös wirkender Artikel. Je 5 Paare.", abb: [
        { folie: "Aufmachung", name: "aufmachung_social_media", svg: (id) => heatmap(id, "Täuscht die Aufmachung? Nach Social-Media-Zeit", "Anteil richtig erkannter Paare je Typ", fuss,
          typen, sm, quoteZelle("screentime", "typ"), { labelBreite: 330, spaltenTitel: "tägliche Social-Media-Zeit" }) },
        { folie: "Aufmachung", name: "aufmachung_alter", svg: (id) => heatmap(id, "Täuscht die Aufmachung? Nach Alter", "Anteil richtig erkannter Paare je Typ", fuss,
          typen, al, quoteZelle("alter", "typ"), { labelBreite: 330, spaltenTitel: "Altersgruppe" }) },
        { folie: "Fake-Merkmale", name: "merkmale_social_media", svg: (id) => heatmap(id, "Welche Fehler werden erkannt? Nach Social-Media-Zeit", "Anteil richtig erkannter Paare je Fake-Merkmal (Anzahl Paare in Klammern)", fuss,
          merkmale, sm, quoteZelle("screentime", "merkmal"), { labelBreite: 470, spaltenTitel: "tägliche Social-Media-Zeit" }) },
        { folie: "Fake-Merkmale", name: "merkmale_alter", svg: (id) => heatmap(id, "Welche Fehler werden erkannt? Nach Alter", "Anteil richtig erkannter Paare je Fake-Merkmal (Anzahl Paare in Klammern)", fuss,
          merkmale, al, quoteZelle("alter", "merkmal"), { labelBreite: 470, spaltenTitel: "Altersgruppe" }) }
      ] },
      { id: "kap-ki", titel: "KI-Siegel", text: "Beim Wolf trägt der Fake ein „Mit KI erstellt“-Siegel, beim Butterpreis die echte Meldung (Falle). Wer KI-Inhalte pauschal für falsch hält, liegt beim Wolf richtig und beim Butterpreis falsch.", abb: [
        { folie: "KI-Siegel / Teaser", name: "ki_siegel", svg: (id) => stapel(id, "Lassen sich die Leute vom KI-Siegel leiten?", "Antworten bei den beiden Paaren mit „Mit KI erstellt“-Siegel", fuss,
          S.filter((s) => s.ki).map((s) => { const g = alle.filter((x) => x.szenario.id === s.id); return { label: s.thema, hinweis: s.ki === "fake" ? "KI-Siegel am Fake" : "KI-Siegel an der echten Meldung", ok: anteil(g, "richtig") ?? 0, no: anteil(g, "falsch") ?? 0, na: anteil(g, "keine_ahnung") ?? 0 }; })) },
        { folie: "KI-Siegel", name: "ki_siegel_alter_social_media", svg: (id) => heatmap(id, "KI-Siegel nach Alter", "Anteil richtig erkannter Paare", fuss,
          kiPaare, al, quoteZelle("alter", "id"), { labelBreite: 520, spaltenTitel: "Altersgruppe" }) }
      ] },
      { id: "kap-sicherheit", titel: "Sicherheit und „Keine Ahnung“", text: "Wie gut schätzen sich die Teilnehmenden selbst ein?", abb: [
        { folie: "Selbstüberschätzung", name: "sicher_richtig_social_media", svg: (id) => hbalken(id, "Wie oft lagen die „Sicheren“ richtig?", "Nur Antworten mit „da bin ich sicher“, nach Social-Media-Zeit", fuss, sicherNach("screentime", sm), 100) },
        { folie: "Selbstüberschätzung", name: "sicher_richtig_alter", svg: (id) => hbalken(id, "Wie oft lagen die „Sicheren“ richtig?", "Nur Antworten mit „da bin ich sicher“, nach Alter", fuss, sicherNach("alter", al), 100) },
        { folie: "Unsicherheit", name: "keine_ahnung_alter", svg: (id) => hbalken(id, "Wie oft wurde „Keine Ahnung“ gewählt?", "Anteil aller Antworten, nach Alter", fuss, ka("alter", al), 100) }
      ] },
      { id: "kap-paare", titel: "Die einzelnen Paare", text: "Welche Meldungen haben am meisten getäuscht? Gut für den Anhang oder als Backup-Folie.", abb: [
        { folie: "Anhang / Backup", name: "einzelne_paare", svg: (id) => paareBild(id, "Ergebnisse aller 15 Paare", "Sortiert von leicht nach schwer", fuss,
          S.map((s) => { const g = alle.filter((x) => x.szenario.id === s.id); return { label: `${s.thema}${s.ki ? " (KI)" : ""}`, ok: anteil(g, "richtig") ?? 0, no: anteil(g, "falsch") ?? 0, na: anteil(g, "keine_ahnung") ?? 0 }; })
            .sort((a, b) => b.ok - a.ok)) }
      ] }
    ];

    // Texte für Dokumentation
    const satz = (was, r, p, df) => r == null ? `${was}: noch zu wenige Daten.` : `${was}: Spearman ρ = ${zahl(r)}, ${pText(p)}, n = ${n}. Das ist ${einordnen(r, p)}.`;
    const texte = [
      satz("Zusammenhang zwischen täglicher Social-Media-Zeit und Trefferquote", rSP, pSP),
      satz("Zusammenhang zwischen Alter und Trefferquote", rAP, pAP),
      satz("Zusammenhang zwischen Alter und Social-Media-Zeit", rAS, pAS),
      rSPa == null ? "" : `Rechnet man das Alter heraus (partielle Korrelation), beträgt der Zusammenhang zwischen Social-Media-Zeit und Trefferquote ρ = ${zahl(rSPa)} (${pText(pSPa)}).`,
      rAPs == null ? "" : `Rechnet man die Social-Media-Zeit heraus, beträgt der Zusammenhang zwischen Alter und Trefferquote ρ = ${zahl(rAPs)} (${pText(pAPs)}).`,
      "Für die Auswertung wurden die ursprünglich sechs Altersgruppen zu vier Gruppen zusammengefasst (unter 20, 20–29, 30–59, 60+)."
    ].filter(Boolean);

    let nr = 0;
    const kapitelHtml = kapitel.map((k, ki) => `
      <section class="block kapitel" id="${k.id}">
        <h2><span class="kapnr">${ki + 1}</span> ${esc(k.titel)}</h2>
        <p class="muted small">${esc(k.text)}</p>
        <div class="abbildungen">${k.abb.map((a) => {
          nr++;
          const id = `abb-${nr}`;
          return `<figure class="folie">
            ${a.svg(id)}
            <figcaption><span><b>Abb. ${nr}</b> · passt zu: ${esc(a.folie)}</span><button class="link" data-png="${id}" data-name="abb${String(nr).padStart(2, "0")}_${a.name}">Als Bild speichern</button></figcaption>
          </figure>`;
        }).join("")}</div>
      </section>`).join("");

    const mittelPunkte = mittel(daten.map((d) => d.p));
    inhalt.innerHTML = `
      ${demo ? `<p class="notice"><b>Simulierte Daten.</b> Diese Zahlen sind erfunden und zeigen nur, wie die Auswertung bei etwa ${n} Teilnehmenden aussehen könnte. Auf jeder Abbildung steht „SIMULATION“. Nicht als echte Ergebnisse verwenden.</p>` : ""}
      ${n < 20 ? `<p class="notice">Erst ${n} Teilnehmende: Korrelationen und Boxplots sind noch sehr unsicher.</p>` : ""}
      <div class="kpis">
        <div class="kpi"><b>${n}</b><span>Teilnehmende</span></div>
        <div class="kpi"><b>${mittelPunkte == null ? "–" : zahl(mittelPunkte, 1)}</b><span>von 15 Paaren richtig im Schnitt (${pct(mittel(rows.map(quote)))})</span></div>
        <div class="kpi"><b>${pct(mittel(rows.map(kaQuote)))}</b><span>„Keine Ahnung“</span></div>
        <div class="kpi"><b>${pct(anteil(sicherAntworten, "richtig"))}</b><span>richtig, wenn „sicher“ gewählt</span></div>
      </div>

      <nav class="inhaltsverzeichnis panel" aria-label="Inhalt">
        <b>Inhalt</b>
        <ol>${kapitel.map((k) => `<li><a href="#${k.id}">${esc(k.titel)}</a></li>`).join("")}<li><a href="#kap-texte">Texte und Erklärungen</a></li></ol>
        <p class="muted small">Alle Abbildungen im Folienformat 16:9. „Als Bild speichern“ lädt ein PNG (1920 × 1080) herunter. Fahrt mit der Maus über Boxen, Felder und Punkte für genaue Werte.</p>
      </nav>

      ${kapitelHtml}

      <section class="block kapitel" id="kap-texte">
        <h2><span class="kapnr">${kapitel.length + 1}</span> Texte und Erklärungen</h2>
        <div class="panel stack">
          <h3>Sätze für Dokumentation und Folien</h3>
          <p class="muted small">So schreibt man die Ergebnisse wissenschaftlich korrekt. Die Werte aktualisieren sich mit den Daten.</p>
          <ul class="saetze">${texte.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
          <button class="link" id="saetze-kopieren" data-text="${esc(texte.join("\n"))}">Sätze kopieren</button>
        </div>
        <div class="panel stack">
          <h3>Abbildungen in der Dokumentation beschriften</h3>
          <p class="small">Unter jede Abbildung kommt eine Bildunterschrift mit Nummer, Inhalt und Quelle, zum Beispiel: <i>„Abb. 4: Trefferquote nach täglicher Social-Media-Zeit (eigene Erhebung, n = ${n}).“</i> Im Text verweist ihr darauf: „Wie Abb. 4 zeigt, …“</p>
        </div>
        <details class="panel" open>
          <summary><b>So lest ihr die Abbildungen</b></summary>
          <ul class="saetze">
            <li><b>Boxplot:</b> Die Box enthält die mittleren 50 % der Teilnehmenden, der dicke Strich ist der Median (die Hälfte liegt darüber, die Hälfte darunter). Die Linien („Whisker“) reichen bis zu den übrigen Werten, einzelne Kreise sind Ausreißer.</li>
            <li><b>Heatmap:</b> Jedes Feld ist eine Kombination aus zwei Merkmalen. Je dunkler, desto höher der Wert. „n“ ist die Zahl der Personen in diesem Feld. Graue Felder haben unter 3 Personen.</li>
            <li><b>ρ (rho):</b> Rangkorrelation nach Spearman, von −1 bis +1. Wir verwenden sie statt r, weil Alter und Social-Media-Zeit in geordneten Stufen abgefragt wurden. Faustregel: unter 0,1 kein, ab 0,1 schwacher, ab 0,3 mittlerer, ab 0,5 starker Zusammenhang.</li>
            <li><b>p-Wert:</b> Wahrscheinlichkeit, so einen Zusammenhang rein zufällig zu finden, obwohl es in Wirklichkeit keinen gibt. Unter 0,05 gilt er als statistisch signifikant.</li>
            <li><b>Partielle Korrelation:</b> Zeigt, ob der Zusammenhang zwischen Social-Media-Zeit und Trefferquote bestehen bleibt, wenn man das Alter als Drittvariable herausrechnet.</li>
            <li><b>Wichtig:</b> Alle Werte zeigen Zusammenhänge, keine Ursachen.</li>
          </ul>
        </details>
      </section>`;
  }

  // PNG-Export und Kopieren
  document.addEventListener("click", async (e) => {
    const knopf = e.target.closest("[data-png]");
    if (knopf) {
      const svg = document.getElementById(knopf.dataset.png);
      const bild = new Image();
      bild.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
      try { await bild.decode(); } catch { knopf.textContent = "Speichern fehlgeschlagen"; return; }
      const c = document.createElement("canvas");
      c.width = 1920; c.height = 1080;
      const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(bild, 0, 0, c.width, c.height);
      const a = document.createElement("a");
      a.href = c.toDataURL("image/png");
      a.download = `${knopf.dataset.name}.png`;
      a.click();
      return;
    }
    const kopieren = e.target.closest("#saetze-kopieren");
    if (kopieren) {
      try { await navigator.clipboard.writeText(kopieren.dataset.text); kopieren.textContent = "Kopiert"; }
      catch { kopieren.textContent = "Kopieren nicht möglich, bitte markieren"; }
    }
  });

})();
</script>
</body>
</html>
